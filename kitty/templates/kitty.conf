# Themy — Kitty theme
# Generated from the Material palette.

# Basic window colors
foreground              {{colors.on_surface.default.hex}}
background              {{colors.surface.default.hex}}
selection_foreground    {{colors.on_primary.default.hex}}
selection_background    {{colors.primary.default.hex}}

# Cursor colors
cursor                  {{colors.primary.default.hex}}
cursor_text_color      {{colors.on_primary.default.hex}}

# URL underline color
url_color               {{colors.secondary.default.hex}}

# Kitty window border colors
active_border_color     {{colors.primary.default.hex}}
inactive_border_color   {{colors.outline.default.hex}}
bell_border_color       {{colors.error.default.hex}}

# 16 terminal colors
color0  {{colors.surface.default.hex}}
color8  {{colors.outline.default.hex}}

color1  {{colors.error.default.hex}}
color9  {{colors.error.default.hex}}

color2  {{colors.tertiary.default.hex}}
color10 {{colors.tertiary.default.hex}}

color3  {{colors.secondary.default.hex}}
color11 {{colors.secondary.default.hex}}

color4  {{colors.primary.default.hex}}
color12 {{colors.primary.default.hex}}

color5  {{colors.tertiary.default.hex}}
color13 {{colors.tertiary.default.hex}}

color6  {{colors.secondary.default.hex}}
color14 {{colors.secondary.default.hex}}

color7  {{colors.on_surface.default.hex}}
color15 {{colors.on_surface.default.hex}}


# Colors for marks
mark1_foreground         {{colors.on_primary.default.hex}}
mark1_background         {{colors.primary.default.hex}}
mark2_foreground         {{colors.on_secondary.default.hex}}
mark2_background         {{colors.secondary.default.hex}}
mark3_foreground         {{colors.on_tertiary.default.hex}}
mark3_background         {{colors.tertiary.default.hex}}

# Font
font_size 14.0

# OS window titlebar colors
wayland_titlebar_color  system
macos_titlebar_color    system

# Tab bar
tab_bar_edge             bottom
tab_bar_style             powerline
tab_powerline_style       slanted
tab_title_template        {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
background_opacity        0.80

# Window behavior
window_padding_width     5
cursor_trail             1
enable_audio_bell        no


