# Themy-owned Yazi flavor — Material You dynamic tokens

# Manager
[mgr]
cwd = { fg = "{{colors.primary.default.hex}}" }

# Find
find_keyword  = { fg = "{{colors.error.default.hex}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{colors.tertiary.default.hex}}", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
marker_cut      = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked   = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
marker_selected = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }

# Count
count_copied   = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
count_cut      = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
count_selected = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}" }

# Border
border_symbol = "│"
border_style  = { fg = "{{colors.outline_variant.default.hex}}" }

# Tabs
[tabs]
active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

# Mode
[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

# Select mode
select_main = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

# Unset mode
unset_main = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
unset_alt  = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

# Status bar
[status]
overall = { fg = "{{colors.primary.default.hex}}" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
progress_error = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

# Permissions
perm_sep   = { fg = "{{colors.outline.default.hex}}" }
perm_type  = { fg = "{{colors.secondary.default.hex}}" }
perm_read  = { fg = "{{colors.tertiary.default.hex}}" }
perm_write = { fg = "{{colors.error.default.hex}}" }
perm_exec  = { fg = "{{colors.primary.default.hex}}" }

# Pick
[pick]
border = { fg = "{{colors.outline.default.hex}}" }
active = { fg = "{{colors.primary.default.hex}}", bold = true }
inactive = {}

# Input
[input]
border   = { fg = "{{colors.outline.default.hex}}" }
title    = {}
value    = {}
selected = { reversed = true }

# Completion
[cmp]
border = { fg = "{{colors.outline.default.hex}}" }

# Tasks
[tasks]
border  = { fg = "{{colors.outline.default.hex}}" }
title   = {}
hovered = { fg = "{{colors.primary.default.hex}}", underline = true }

# Which
[which]
mask            = { bg = "{{colors.surface_container.default.hex}}" }
cand            = { fg = "{{colors.secondary.default.hex}}" }
rest            = { fg = "{{colors.on_surface_variant.default.hex}}" }
desc            = { fg = "{{colors.tertiary.default.hex}}" }
separator       = "  "
separator_style = { fg = "{{colors.outline_variant.default.hex}}" }

# Help
[help]
on      = { fg = "{{colors.secondary.default.hex}}" }
run     = { fg = "{{colors.primary.default.hex}}" }
hovered = { reversed = true, bold = true }
footer  = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

# Spotter
[spot]
border   = { fg = "{{colors.outline.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}" }
tbl_col  = { fg = "{{colors.secondary.default.hex}}" }
tbl_cell = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

# Notify
[notify]
title_info  = { fg = "{{colors.secondary.default.hex}}" }
title_warn  = { fg = "{{colors.tertiary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

# File-specific styles
[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "{{colors.tertiary.default.hex}}" },

	# Media
	{ mime = "video/*", fg = "{{colors.error.default.hex}}" },
	{ mime = "audio/*", fg = "{{colors.error.default.hex}}" },

	# Archives
	{ mime = "application/zip",             fg = "{{colors.primary.default.hex}}" },
	{ mime = "application/x-tar",           fg = "{{colors.primary.default.hex}}" },
	{ mime = "application/x-bzip*",         fg = "{{colors.primary.default.hex}}" },
	{ mime = "application/x-bzip2",         fg = "{{colors.primary.default.hex}}" },
	{ mime = "application/x-7z-compressed", fg = "{{colors.primary.default.hex}}" },
	{ mime = "application/x-rar",           fg = "{{colors.primary.default.hex}}" },
	{ mime = "application/x-xz",            fg = "{{colors.primary.default.hex}}" },

	# Documents
	{ mime = "application/doc",        fg = "{{colors.secondary.default.hex}}" },
	{ mime = "application/epub+zip",   fg = "{{colors.secondary.default.hex}}" },
	{ mime = "application/pdf",        fg = "{{colors.secondary.default.hex}}" },
	{ mime = "application/rtf",        fg = "{{colors.secondary.default.hex}}" },
	{ mime = "application/vnd.*",      fg = "{{colors.secondary.default.hex}}" },

	# Special files
	{ mime = "*", is = "orphan", fg = "{{colors.error_container.default.hex}}", bg = "{{colors.on_error_container.default.hex}}" },
	{ mime = "application/*exec*", fg = "{{colors.error.default.hex}}" },

	# Fallback
	{ url = "*", fg = "{{colors.on_surface.default.hex}}" },
	{ url = "*/", fg = "{{colors.primary.default.hex}}" },
]
